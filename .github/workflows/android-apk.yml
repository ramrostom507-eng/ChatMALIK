name: Build ChatMALIK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Build web assets and sync native project
        run: npm run cap:sync
      - name: Generate original ChatMALIK dark-blue launcher icons
        run: node scripts/generate-android-icons.mjs
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatMALIK-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ChatMALIK Android (Latest)
          body: Latest installable ChatMALIK Android APK with the original dark-blue ChatMALIK launcher icon, built from the main branch.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true