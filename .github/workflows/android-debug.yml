name: Build ChatMALIK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mobile-android-build
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: chatmalik-android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-debug:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ChatMALIK
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Prepare web application
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Apply Android permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Generate dark-blue Android launcher icon
        run: node scripts/generate-android-icons.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 assembleDebug

      - name: Upload ChatMALIK APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatMALIK-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_TAG="chatmalik-android-latest"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "ChatMALIK Android APK" --notes "Latest installable ChatMALIK Android APK. Built automatically from the main branch." --target "$GITHUB_SHA" --prerelease
          gh release upload "$RELEASE_TAG" "$APK_PATH#ChatMALIK.apk" --clobber
