name: Build ChatMALIK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mobile-android-build
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out ChatMALIK
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web application
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload ChatMALIK APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatMALIK-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
